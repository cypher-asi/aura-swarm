[package]
name = "aura-swarm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Terminal UI for managing AURA Swarm agents"

[[bin]]
name = "aswarm"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# HTTP client
reqwest.workspace = true

# WebSocket client
tokio-tungstenite.workspace = true

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror.workspace = true
anyhow = "1"

# Markdown parsing
pulldown-cmark = "0.12"

# Syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Date/time
chrono.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber.workspace = true

# Base64 decoding for tool results
base64.workspace = true

# Protocol types (shared with gateway + harness)
aura-swarm-protocol = { path = "../aura-swarm-protocol" }

# Auth (zOS login)
aura-swarm-auth = { path = "../aura-swarm-auth" }
dirs = "6"

[lints]
workspace = true
