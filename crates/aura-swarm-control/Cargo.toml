[package]
name = "aura-swarm-control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Control plane for aura-swarm agent lifecycle management"

[[bin]]
name = "aura-swarm-control"
path = "src/main.rs"

[features]
default = []
test-utils = ["aura-swarm-auth/test-utils"]

[dependencies]
aura-swarm-core = { path = "../aura-swarm-core" }
aura-swarm-store = { path = "../aura-swarm-store" }
aura-swarm-auth = { path = "../aura-swarm-auth" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

# HTTP client for scheduler communication
reqwest = { workspace = true }

# KBS DEK lifecycle: admin-token signing + DEK generation/zeroization
jsonwebtoken = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }

# HTTP server (for binary)
axum.workspace = true
tower-http.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
