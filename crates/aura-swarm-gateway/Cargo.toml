[package]
name = "aura-swarm-gateway"
description = "HTTP and WebSocket gateway for aura-swarm agent platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "aura-swarm-gateway"
path = "src/main.rs"

[features]
default = []
dev-mode = ["aura-swarm-auth/test-utils"]

[dependencies]
# Tracing
tracing-subscriber.workspace = true
# Internal crates
aura-swarm-core = { path = "../aura-swarm-core" }
aura-swarm-auth = { path = "../aura-swarm-auth" }
aura-swarm-control = { path = "../aura-swarm-control" }
aura-swarm-store = { path = "../aura-swarm-store" }

# Web framework
axum = { workspace = true, features = ["ws", "macros"] }
tower = "0.4"
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }

# Async runtime
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
aura-swarm-store = { path = "../aura-swarm-store" }
aura-swarm-auth = { path = "../aura-swarm-auth", features = ["test-utils"] }
aura-swarm-control = { path = "../aura-swarm-control" }
aura-swarm-core = { path = "../aura-swarm-core" }
tokio = { workspace = true, features = ["test-util"] }
axum-test = "15"
serde_json.workspace = true

[lints]
workspace = true
