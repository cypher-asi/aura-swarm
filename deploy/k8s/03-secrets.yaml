# Secrets for Aura Swarm
# Values are injected from .secrets/ folder during deployment
# DO NOT commit actual secrets to this file!
---
apiVersion: v1
kind: Secret
metadata:
  name: aura-swarm-secrets
  namespace: swarm-system
type: Opaque
stringData:
  # LLM API Keys (injected from .secrets/ folder)
  ANTHROPIC_API_KEY: "__ANTHROPIC_API_KEY__"
  OPENAI_API_KEY: "__OPENAI_API_KEY__"
  
  # zbilling service authentication (injected from .secrets/ folder)
  Z_BILLING_API_KEY: "__Z_BILLING_API_KEY__"

  # Internal service-to-service API bearer token (injected from .secrets/ folder)
  INTERNAL_TOKEN: "__INTERNAL_TOKEN__"
---
# Secrets for agent pods (same keys, different namespace)
apiVersion: v1
kind: Secret
metadata:
  name: aura-swarm-secrets
  namespace: swarm-agents
type: Opaque
stringData:
  # LLM API Keys (injected from .secrets/ folder)
  ANTHROPIC_API_KEY: "__ANTHROPIC_API_KEY__"
  OPENAI_API_KEY: "__OPENAI_API_KEY__"
---
# Configuration for Aura Swarm services
apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-swarm-config
  namespace: swarm-system
data:
  # Logging
  RUST_LOG: "info,aura_swarm=debug"
  
  # Service addresses for cross-service communication
  GATEWAY_URL: "http://aura-swarm-gateway.swarm-system.svc:8080"
  SCHEDULER_URL: "http://aura-swarm-scheduler.swarm-system.svc:8080"
  
  # Listen addresses
  GATEWAY_LISTEN_ADDR: "0.0.0.0:8080"
  CONTROL_LISTEN_ADDR: "0.0.0.0:8080"
  
  # Scheduler configuration
  SCHEDULER_NAMESPACE: "swarm-agents"
  STATE_PVC_NAME: "swarm-agent-state"
  
  # Aura runtime image - injected by the deploy steps (06/09/11)
  # Format: ECR_REGISTRY/aura-swarm-ENVIRONMENT-runtime:IMAGE_TAG
  AURA_RUNTIME_IMAGE: "REPLACE_WITH_ECR_REGISTRY/RESOURCE_PREFIX-runtime:v0.1.0"
  
  # Aura harness image (reasoning engine) - pinned digest injected by the
  # deploy steps; build with legacy/07-build-images.sh --harness
  AURA_HARNESS_IMAGE: "ECR_REGISTRY/RESOURCE_PREFIX-harness:IMAGE_TAG"
  
  # LLM routing via aura-router (proxy mode, no raw API keys in agent pods)
  AURA_ROUTER_URL: "https://aura-router.onrender.com"
  
  # Service URLs for domain tools in agent pods
  AURA_STORAGE_URL: "https://aura-storage.onrender.com"
  AURA_NETWORK_URL: "https://aura-network.onrender.com"

  # Isolation level: "confidential_vm" (Peer Pods / kata-remote) or "container"
  # (uses runc, dev only). Set via DEFAULT_ISOLATION in config.env.
  DEFAULT_ISOLATION: "__DEFAULT_ISOLATION__"
  
  # zbilling configuration
  Z_BILLING_URL: "https://z-billing.onrender.com"
  Z_BILLING_ENABLED: "true"
  Z_BILLING_FAIL_CLOSED: "true"
