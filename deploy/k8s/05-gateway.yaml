# Gateway Deployment and Service
# Public API, WebSocket proxy, JWT validation
#
# NOTE: Uses a single replica because RocksDB doesn't support concurrent writers.
# For HA, use a distributed database or leader election.
---
# PVC for gateway RocksDB data (uses existing EFS storage class)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aura-swarm-gateway-data
  namespace: swarm-system
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-swarm-gateway
  namespace: swarm-system
  labels:
    app: aura-swarm-gateway
spec:
  # Single replica because RocksDB doesn't support concurrent writers
  # For HA, consider using a distributed database or leader election
  replicas: 1
  strategy:
    type: Recreate  # Ensures old pod is fully terminated before new one starts
  selector:
    matchLabels:
      app: aura-swarm-gateway
  template:
    metadata:
      labels:
        app: aura-swarm-gateway
    spec:
      serviceAccountName: aura-swarm-gateway
      containers:
        - name: gateway
          image: ECR_REGISTRY/RESOURCE_PREFIX-gateway:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: aura-swarm-config
                  key: RUST_LOG
            - name: LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: aura-swarm-config
                  key: GATEWAY_LISTEN_ADDR
            - name: DATA_DIR
              value: "/data/aura-swarm"
            - name: AUTH_BASE_URL
              value: "https://zosapi.zero.tech"
            # Scheduler URL for agent lifecycle operations
            - name: SCHEDULER_URL
              valueFrom:
                configMapKeyRef:
                  name: aura-swarm-config
                  key: SCHEDULER_URL
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aura-swarm-secrets
                  key: INTERNAL_TOKEN
            # Real confidential pod-VM size so the agent state endpoint reports
            # actual resources (the peer-pods webhook strips the tier spec).
            - name: POD_VM_INSTANCE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: aura-swarm-config
                  key: POD_VM_INSTANCE_TYPE
                  optional: true
            # Trustee KBS: the gateway provisions a per-agent state DEK on
            # confidential-agent create (and backfills missing ones at startup)
            # via the KBS admin API. Without these the gateway uses a no-op KBS
            # client, agents are created with NO DEK, and their harness loops on
            # the attestation-gated DEK fetch ("CDH ... returned 500") and never
            # becomes Ready. KBS_ADMIN_KEY_PATH points at the mounted private key.
            - name: KBS_URL
              value: "http://kbs.swarm-system.svc.cluster.local:8080"
            - name: KBS_ENABLED
              value: "true"
            - name: KBS_ADMIN_KEY_PATH
              value: "/etc/kbs-admin/kbs-admin.key"
            # zbilling integration
            - name: Z_BILLING_URL
              valueFrom:
                configMapKeyRef:
                  name: aura-swarm-config
                  key: Z_BILLING_URL
            - name: Z_BILLING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-swarm-secrets
                  key: Z_BILLING_API_KEY
                  optional: true
            - name: Z_BILLING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aura-swarm-config
                  key: Z_BILLING_ENABLED
                  optional: true
            - name: Z_BILLING_FAIL_CLOSED
              valueFrom:
                configMapKeyRef:
                  name: aura-swarm-config
                  key: Z_BILLING_FAIL_CLOSED
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data/aura-swarm
            - name: kbs-admin-key
              mountPath: /etc/kbs-admin
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aura-swarm-gateway-data
        # Admin private key (Ed25519 PEM) for the KBS DEK lifecycle. Synced from
        # .secrets/kbs-admin.key into the kbs-admin-key Secret by ./04 (
        # ensure_kbs_admin_keypair). World-readable within the pod (defaultMode
        # 0444) so the non-root (uid 1000) gateway can read the root-owned file.
        - name: kbs-admin-key
          secret:
            secretName: kbs-admin-key
            defaultMode: 0444
---
# Internal ClusterIP service
apiVersion: v1
kind: Service
metadata:
  name: aura-swarm-gateway
  namespace: swarm-system
spec:
  selector:
    app: aura-swarm-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
# External LoadBalancer service
apiVersion: v1
kind: Service
metadata:
  name: aura-swarm-gateway-lb
  namespace: swarm-system
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: aura-swarm-gateway
  ports:
    - port: 80
      targetPort: 8080
      name: http
