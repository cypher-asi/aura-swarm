# kata-remote host prerequisite: containerd guest-pull (nydus) snapshotter flags
#
# kata-remote (Peer Pods) pulls the WORKLOAD image inside the guest pod VM
# (CoCo "image_guest_pull") and presents it to containerd on the worker via the
# nydus snapshotter. For containerd to route a workload container's image to the
# nydus snapshotter (instead of unpacking it on the host) two CRI settings must
# be off:
#   disable_snapshot_annotations = false  # pass image annotations to nydus
#   discard_unpacked_layers      = false  # keep layer blobs for on-demand pull
#
# Stock EKS containerd defaults BOTH to true, and kata-deploy does not reliably
# set them in the right place: on containerd 2.x / config-version-3 the setting
# lives under the SPLIT images plugin (io.containerd.cri.v1.images), not the
# runtime plugin (kata-containers PR #12577). When they are wrong, the pod
# sandbox (pause) still guest-pulls but the workload container is unpacked on the
# host and fails to create with:
#   error unpacking image ...: failed to get reader from content store:
#   content digest sha256:...: not found
# -> the kata-remote pod is stuck CreateContainerError.
#
# This privileged DaemonSet idempotently ensures both flags are false, restarts
# containerd ONLY when it changed, and is a no-op once correct. As a DaemonSet it
# also covers nodes added by future scale-ups. It targets the same workers as the
# CAA daemonset (node.kubernetes.io/worker=""). Applied by ./03-coco-operator.sh
# (namespace templated as __CAA_NAMESPACE__).
#
# IMPORTANT — how the flags are applied depends on the containerd config version:
#   * v3 (containerd 2.x): the flags live under the SPLIT images plugin
#     (io.containerd.cri.v1.images), a different plugin from the runtimes, so a
#     standalone import drop-in is safe.
#   * v2 (containerd 1.7.x, the pinned AMI): the flags AND the kata runtimes share
#     [plugins."io.containerd.grpc.v1.cri".containerd]. containerd OVERRIDE-merges
#     a plugin's entire subtree across `imports` (it does NOT deep-merge), so a
#     drop-in that re-declares that table silently WIPES runtimes.kata-remote and
#     every kata-remote pod then fails with "no runtime for kata-remote is
#     configured". So on v2 we edit the two flags IN PLACE in the main config that
#     kata-deploy manages (and remove any legacy clobbering drop-in), keeping the
#     runtimes intact. A guard verifies kata-remote survives in the merged config.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-remote-containerd-guestpull
  namespace: __CAA_NAMESPACE__
  labels:
    app.kubernetes.io/name: kata-remote-containerd-guestpull
    app.kubernetes.io/part-of: cloud-api-adaptor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kata-remote-containerd-guestpull
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kata-remote-containerd-guestpull
    spec:
      # Same workers the CAA daemonset targets (03 labels nodes with this).
      nodeSelector:
        node.kubernetes.io/worker: ""
      # PID1 + privileged so we can edit host containerd config and restart it.
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: configurer
          image: public.ecr.aws/amazonlinux/amazonlinux:2023
          securityContext:
            privileged: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              # The amazonlinux base image does NOT ship nsenter; install it
              # (util-linux-core) so we can enter the host namespaces.
              if ! command -v nsenter >/dev/null 2>&1; then
                echo "installing util-linux-core (for nsenter) in the configurer container..."
                (dnf -y install util-linux-core || dnf -y install util-linux \
                  || yum -y install util-linux) || true
              fi
              command -v nsenter >/dev/null 2>&1 \
                || { echo "ERROR: could not obtain nsenter in the configurer container"; exit 1; }
              # Run on the host via PID1's namespaces (host fs + systemd).
              host() { nsenter -t 1 -m -u -i -n -p -- "$@"; }

              CONF=/etc/containerd/config.toml
              DROPIN_DIR=/etc/containerd/config.d
              DROPIN="${DROPIN_DIR}/zz-coco-guestpull.toml"

              # Source of truth for the *effective* (merged) config + version.
              DUMP="$(host containerd config dump 2>/dev/null || true)"

              # Detect the containerd config version. On v3 (containerd 2.x) the
              # guest-pull flags live under the SPLIT images plugin, a different
              # plugin from the runtimes — so an import drop-in there is safe. On
              # v2 (containerd 1.7.x, what we pin) the flags AND the kata runtimes
              # share [plugins."io.containerd.grpc.v1.cri".containerd], and
              # containerd OVERRIDE-merges a plugin's whole subtree across imports
              # (it does NOT deep-merge), so a drop-in re-declaring that table
              # silently WIPES runtimes.kata-remote from the effective config
              # ("no runtime for kata-remote is configured"). Edit the flags in
              # place in that case instead of via a clobbering import.
              if printf '%s' "$DUMP" | grep -q 'io.containerd.cri.v1.images'; then
                # ---- containerd 2.x / config v3: images plugin is separate ----
                VERSION=3
                TABLE="[plugins.'io.containerd.cri.v1.images']"
                echo "containerd config version detected: ${VERSION}; writing drop-in under ${TABLE}"
                host mkdir -p "$DROPIN_DIR"
                printf 'version = %s\n%s\n  disable_snapshot_annotations = false\n  discard_unpacked_layers = false\n' \
                  "$VERSION" "$TABLE" | host tee "$DROPIN" >/dev/null
                echo "wrote ${DROPIN}:"
                host cat "$DROPIN" | sed 's/^/  /'
                if ! host grep -qF "$DROPIN" "$CONF"; then
                  host cp -n "$CONF" "${CONF}.coco-guestpull.bak" || true
                  if host grep -qE '^[[:space:]]*imports[[:space:]]*=[[:space:]]*\[' "$CONF"; then
                    host sed -i "s#^\([[:space:]]*imports[[:space:]]*=[[:space:]]*\[\)#\1\n  \"${DROPIN}\",#" "$CONF"
                  else
                    host sed -i "1i imports = [\"${DROPIN}\"]" "$CONF"
                  fi
                  echo "added ${DROPIN} to imports in ${CONF}"
                fi
                CHANGED=1
              else
                # ---- containerd 1.7.x / config v2: flags share the runtime plugin ----
                VERSION=2
                TABLE='[plugins."io.containerd.grpc.v1.cri".containerd]'
                echo "containerd config version detected: ${VERSION}; setting flags in place under ${TABLE}"
                CHANGED=0
                ORIG="$(host cat "$CONF")"
                WORK="$ORIG"
                # Undo any legacy clobbering import: drop the line referencing our
                # drop-in and delete the file, so the runtimes the import wiped
                # come back. grep -v drops the import-array element line (or the
                # whole single-entry imports line).
                if printf '%s' "$WORK" | grep -qF "$DROPIN"; then
                  echo "removing legacy guest-pull import (it clobbered the kata-remote runtime)"
                  WORK="$(printf '%s\n' "$WORK" | grep -vF "$DROPIN" || true)"
                fi
                host rm -f "$DROPIN" 2>/dev/null || true
                # Set both flags to false WITHIN the existing CRI containerd table
                # (leaving the runtimes.* sub-tables, incl. kata-remote, untouched):
                # replace the keys if present, else append them to that table.
                WORK="$(printf '%s\n' "$WORK" | awk -v hdr="$TABLE" '
                  function emit_missing(){ if(!dsa)print "disable_snapshot_annotations = false"; if(!dul)print "discard_unpacked_layers = false" }
                  BEGIN{in_t=0;dsa=0;dul=0;seen=0}
                  {
                    t=$0; sub(/^[ \t]+/,"",t); sub(/[ \t]+$/,"",t)
                    if (t ~ /^\[/){
                      if(in_t){emit_missing();in_t=0}
                      if(t==hdr){in_t=1;seen=1;dsa=0;dul=0}
                      print; next
                    }
                    if(in_t){
                      k=$0; sub(/^[ \t]+/,"",k)
                      if(k ~ /^disable_snapshot_annotations[ \t]*=/){print "disable_snapshot_annotations = false";dsa=1;next}
                      if(k ~ /^discard_unpacked_layers[ \t]*=/){print "discard_unpacked_layers = false";dul=1;next}
                    }
                    print
                  }
                  END{
                    if(in_t){emit_missing()}
                    else if(!seen){print hdr; print "disable_snapshot_annotations = false"; print "discard_unpacked_layers = false"}
                  }
                ')"
                if [ "$WORK" != "$ORIG" ]; then
                  host cp -n "$CONF" "${CONF}.coco-guestpull.bak" 2>/dev/null || true
                  printf '%s\n' "$WORK" | host tee "$CONF" >/dev/null
                  echo "updated ${CONF} (guest-pull flags set in place; kata runtimes preserved)"
                  CHANGED=1
                fi
              fi

              if [ "${CHANGED:-0}" -eq 1 ]; then
                echo "restarting containerd to apply guest-pull config..."
                host systemctl restart containerd
                sleep 5
              else
                echo "containerd guest-pull config already correct - no restart needed"
              fi

              # Verify the merged config now has both flags false.
              VERIFY="$(host containerd config dump 2>/dev/null || true)"
              if ! { printf '%s' "$VERIFY" | grep -qE 'disable_snapshot_annotations[[:space:]]*=[[:space:]]*false' \
                 && printf '%s' "$VERIFY" | grep -qE 'discard_unpacked_layers[[:space:]]*=[[:space:]]*false'; }; then
                echo "ERROR: guest-pull flags still not effective after restart; dumping cri image config:"
                printf '%s' "$VERIFY" | grep -E 'disable_snapshot_annotations|discard_unpacked_layers|cri.v1.images|grpc.v1.cri' | sed 's/^/  /' || true
                exit 1
              fi
              echo "containerd guest-pull flags now effective"

              # Ensure the kata-remote snapshotter is actually BOUND by containerd,
              # not merely declared. kata-deploy points the kata-remote runtime at a
              # nydus guest-pull snapshotter (a proxy plugin, e.g. nydus-for-kata-tee)
              # whose grpc daemon typically starts AFTER containerd's last restart.
              # containerd then leaves that proxy snapshotter UNBOUND (the plugin
              # loads in error/skip state because its socket was absent at startup),
              # and the per-runtime snapshotter never engages: the WORKLOAD image is
              # pulled+unpacked on the HOST via overlayfs and a layer's content is not
              # in the host store -> "content digest ...: not found"
              # (CreateContainerError) while the pause sandbox still guest-pulls. The
              # flags above can be perfectly correct and this still happens, so a
              # flags-only "no restart needed" path leaves the node broken. Restart
              # containerd ONCE here to bind the proxy plugin (the exact fix a manual
              # `systemctl restart containerd` performs); idempotent — a no-op once the
              # plugin is loaded "ok". Version-independent (the daemon-vs-containerd
              # start-order race is the same on v2 and v3).
              CTR="ctr -a /run/containerd/containerd.sock"
              # Snapshotter the kata-remote runtime uses (default overlayfs => nothing
              # to bind). Parse the runtimes.kata-remote block of the effective config.
              SNAP="$(printf '%s' "$VERIFY" | awk '
                /runtimes\.kata-remote\]/{in_r=1; next}
                in_r && /^[[:space:]]*\[/{in_r=0}
                in_r && /snapshotter[[:space:]]*=/{gsub(/.*=|["\x27[:space:]]/,"");print;exit}')"
              if [ -n "$SNAP" ] && [ "$SNAP" != "overlayfs" ]; then
                # Resolve the proxy plugin socket (diagnostics only; the bind check
                # uses containerd's own plugin status, which is authoritative).
                SOCK="$(printf '%s' "$VERIFY" | awk -v n="$SNAP" '
                  $0 ~ ("proxy_plugins\\.(\""n"\"|"n")\\]"){in_p=1; next}
                  in_p && /^[[:space:]]*\[/{in_p=0}
                  in_p && /address[[:space:]]*=/{gsub(/.*=|["\x27[:space:]]/,"");print;exit}')"
                # bound: containerd loaded the snapshotter proxy plugin with STATUS ok.
                # `ctr plugins ls` columns: TYPE ID PLATFORMS STATUS; an unbound proxy
                # plugin shows "error"/"skip" (or is absent) instead of "ok".
                bound() { host $CTR plugins ls 2>/dev/null \
                  | awk -v n="$SNAP" '$2==n && $NF=="ok"{f=1} END{exit f?0:1}'; }
                if bound; then
                  echo "kata-remote snapshotter ${SNAP} already bound by containerd (ok)"
                else
                  echo "kata-remote snapshotter ${SNAP} not bound by containerd; restarting containerd to bind the nydus proxy plugin..."
                  host systemctl restart containerd
                  sleep 5
                fi
                if ! bound; then
                  echo "ERROR: kata-remote snapshotter ${SNAP} still not bound after restart"
                  echo "       (image pulls fall back to host overlayfs -> 'content digest not found'). Diagnostics:"
                  host $CTR plugins ls 2>/dev/null | grep -iE "TYPE|${SNAP}|nydus" | sed 's/^/  /' || true
                  if [ -n "$SOCK" ]; then
                    echo "  proxy plugin socket ${SOCK}:"
                    host ls -l "$SOCK" 2>&1 | sed 's/^/    /' || true
                  fi
                  printf '%s' "$VERIFY" | grep -iE 'proxy_plugins' | sed 's/^/  /' || true
                  exit 1
                fi
                echo "verified: kata-remote snapshotter ${SNAP} is bound (ok) - workload images guest-pull via nydus"
              else
                echo "note: kata-remote uses the default snapshotter (or is not configured yet); no nydus proxy plugin to bind"
              fi

              # Regression guard for the import-clobber bug: if kata-deploy has
              # defined the kata-remote runtime in the main config, it MUST also
              # survive in the EFFECTIVE (merged) config. If it does not, an import
              # is overriding the CRI plugin subtree again — fail loudly instead of
              # letting step 05 hit "no runtime for kata-remote is configured".
              if host grep -q 'kata-remote' "$CONF"; then
                if ! printf '%s' "$VERIFY" | grep -q 'kata-remote'; then
                  echo "ERROR: kata-remote runtime is in ${CONF} but MISSING from the effective"
                  echo "       containerd config — a config import is clobbering the CRI plugin subtree."
                  exit 1
                fi
                echo "verified: kata-remote runtime present in the effective containerd config"
              else
                echo "note: kata-remote runtime not in ${CONF} yet (kata-deploy may not have run on this node)"
              fi

              # Stay Ready; the readiness probe re-checks the marker.
              touch /tmp/guestpull-ready
              exec sleep infinity
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/guestpull-ready"]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
